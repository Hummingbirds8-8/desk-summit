<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Mobile App PWA Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>DeskSummit - ライト登山フィットネス</title>
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
  <!-- Canvas for reward animations -->
  <canvas id="particle-canvas"></canvas>

  <!-- Main Container (constrained to mobile width) -->
  <div id="app-wrapper">
    
    <!-- HEADER -->
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-emoji">🏔️</span>
        <div class="logo-text">
          <h1>DeskSummit</h1>
          <span class="subtext">記録で登るフィットネス</span>
        </div>
      </div>
      <div class="header-badges">
        <div class="stat-badge streak-badge" id="streak-badge" title="連続継続日数">
          <span class="badge-icon">🔥</span>
          <span class="badge-text"><span id="streak-count">0</span>日連続</span>
        </div>
      </div>
    </header>

    <!-- CALENDAR WIDGET -->
    <section class="widget-section">
      <h2 class="section-title">今月のロードマップ</h2>
      <div class="calendar-scroll-container">
        <div id="calendar-widget" class="calendar-widget">
          <!-- JS will populate daily cards here -->
        </div>
      </div>
    </section>

    <!-- MOUNTAIN PROGRESS VIEW -->
    <section class="mountain-section">
      <div class="mountain-header">
        <div class="mountain-selector-wrapper">
          <label for="mountain-select" class="selector-label">挑戦中の山:</label>
          <select id="mountain-select" class="mountain-dropdown">
            <option value="fuji" data-height="3776">富士山 (3,776m)</option>
            <option value="kailash" data-height="6638">カイラス山 (6,638m)</option>
            <option value="everest" data-height="8848">エベレスト (8,848m)</option>
          </select>
        </div>
      </div>

      <!-- Mountain Visualizer Area -->
      <div class="mountain-display-container">
        <!-- Sky backgound -->
        <div class="mountain-sky">
          <div class="sky-sun"></div>
          <div class="floating-cloud cloud1"></div>
          <div class="floating-cloud cloud2"></div>
        </div>

        <!-- Mountain Silhouette Layers -->
        <div class="mountain-layer layer-back"></div>
        <div class="mountain-layer layer-mid"></div>
        <div class="mountain-layer layer-front">
          <div class="summit-flag" id="summit-flag">🚩</div>
        </div>

        <!-- Climber / Hiker Pin -->
        <div class="hiker-pin" id="hiker-pin">
          <span class="hiker-emoji">🧗</span>
          <span class="hiker-label">あなた</span>
        </div>

        <!-- Message Balloon -->
        <div class="mountain-balloon" id="avatar-balloon">
          一歩一歩、山頂を目指しましょう！
        </div>
      </div>

      <!-- Progress Stats -->
      <div class="progress-stats-card">
        <div class="progress-info">
          <span class="progress-label">現在の標高</span>
          <span class="progress-value" id="elevation-ratio-text">
            <span id="current-elevation-val">0</span>m / <span id="target-elevation-val">3,776</span>m
          </span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="elevation-progress-fill"></div>
        </div>
      </div>
    </section>

    <!-- FITNESS CONTROLS (Timer & Manual Entry) -->
    <section class="control-section">
      
      <!-- STOPWATCH TIMER -->
      <div class="card stopwatch-card">
        <h3 class="card-title">🕒 ストップウォッチ</h3>
        <div class="stopwatch-display" id="stopwatch-display">00:00.0</div>
        <div class="stopwatch-controls">
          <button id="timer-toggle-btn" class="btn btn-primary">スタート</button>
          <button id="timer-reset-btn" class="btn btn-secondary" disabled>リセット</button>
          <button id="timer-apply-btn" class="btn btn-accent" disabled>数値をフォームに入力</button>
        </div>
      </div>

      <!-- EXERCISE RECORD FORM -->
      <div class="card record-card">
        <h3 class="card-title">📝 トレーニング手動入力</h3>
        <form id="exercise-form" onsubmit="return false;">
          <div class="form-group">
            <label for="exercise-select" class="form-label">種目</label>
            <select id="exercise-select" class="form-control">
              <option value="plank" data-unit="分" data-default="1" data-ratio="100">フロント・プランク</option>
              <option value="widesquat" data-unit="回" data-default="20" data-ratio="5">ワイド・スクワット</option>
              <option value="twist" data-unit="回" data-default="20" data-ratio="3">体幹ツイスト</option>
              <option value="other" data-unit="分" data-default="5" data-ratio="20">その他</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group form-group-half">
              <label for="exercise-amount" class="form-label">数値</label>
              <input type="number" id="exercise-amount" class="form-control" min="1" required step="any">
            </div>
            <div class="form-group form-group-half">
              <span class="form-label">単位</span>
              <span id="exercise-unit" class="unit-badge">分</span>
            </div>
          </div>

          <div class="estimated-elevation-display">
            獲得標高 (予測): <span id="estimated-elevation-val">100</span>m
          </div>

          <button type="button" id="submit-record-btn" class="btn btn-submit">
            🏔️ 記録して登る
          </button>
        </form>
      </div>

      <!-- GAS SETTINGS ACCORDION -->
      <div class="settings-accordion">
        <button type="button" class="accordion-trigger" id="settings-trigger">
          ⚙️ GAS・カレンダー連携設定 <span class="arrow">▼</span>
        </button>
        <div class="accordion-content" id="settings-content">
          <div class="form-group">
            <label for="gas-url-input" class="form-label">GAS WebアプリURL</label>
            <input type="url" id="gas-url-input" class="form-control" placeholder="https://script.google.com/macros/s/.../exec">
            <span class="help-text">Google Apps ScriptでウェブアプリとしてデプロイしたURLを入力します。</span>
          </div>
          <button type="button" id="save-settings-btn" class="btn btn-secondary btn-full">設定を保存</button>
        </div>
      </div>

    </section>

    <!-- FOOTER -->
    <footer class="app-footer">
      <p>&copy; 2026 DeskSummit. Created for Light Climbing Fitness.</p>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
